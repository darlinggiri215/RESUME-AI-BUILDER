{% extends "base.html" %}

{% block title %}Login - Resume AI Builder{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>🔐 Login</h1>
        <p class="auth-subtitle">Welcome back to Resume AI Builder</p>
        
        {% if error %}
        <div class="error-box">
            <strong>❌ Error:</strong> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="your@email.com"
                    class="form-input"
                >
                <small>Use the email you signed up with</small>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="form-input"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
        
        <div class="auth-links">
            <a href="{{ url_for('forgot_password') }}" class="forgot-password-link">Forgot Password?</a>
        </div>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="/signup">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}
